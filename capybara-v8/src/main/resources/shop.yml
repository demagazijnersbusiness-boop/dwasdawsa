# CAPYBARA SMP shop + sell prices
# Prices accept K, M, B, T, QA, QI, SX, SP, OC, NO, DC (example: 2.5K, 1M, 3QA)
# Items that are in the shop but NOT in 'sell:' sell automatically for sell-percent % of the shop price.
# Invalid material names are skipped (see server log). After editing: /csb reload

sell-percent: 25

# Items that are NOT listed anywhere sell for this price each (0 = they cannot be sold).
default-sell-price: 1

# EVERY item in the game is in the shop. Items that are not in a category below are added
# automatically to the categories 'All Blocks', 'Plants & Decoration+', 'All Other Items' and 'Spawn Eggs'.
auto-all-items: true
default-buy-price: 200      # price of automatically added items (diamond/gold/netherite items cost more)
spawn-egg-price: 25K
auto-sell-percent: 10       # automatically added items sell for this % of their shop price

# These can NEVER be bought (not in any category, not found by search). Names that do not exist are ignored.
# Note: there is no ender dragon spawn egg in Minecraft - the Dragon Egg block is blocked instead.
blocked-items:
  - DRAGON_EGG
  - ENDER_DRAGON_SPAWN_EGG
  - WITHER_SPAWN_EGG
  - WARDEN_SPAWN_EGG
