name: CapybaraScoreboard
version: 1.0.0
main: net.capybarasmp.scoreboard.CapybaraScoreboard
api-version: '26.3'
description: CAPYBARA SMP - scoreboard, money, sell, shop, emerald and spawners
author: CapybaraSMP

commands:
  lives:
    description: Show your lives, or manage another player's lives (admin)
    usage: /lives [<player> <set|add|remove> <amount>]
  capybarascoreboard:
    description: Admin command for the plugin
    usage: /capybarascoreboard reload
    aliases: [csb]
  money:
    description: Show your balance
    usage: /money [player]
    aliases: [bal, balance]
  pay:
    description: Pay another player
    usage: /pay <player> <amount>
  baltop:
    description: Richest players
    usage: /baltop
    aliases: [balancetop]
  eco:
    description: Admin economy command
    usage: /eco <give|take|set> <player> <amount>
  sell:
    description: Sell items
    usage: /sell [hand|all]
  shop:
    description: Open the shop
    usage: /shop
  skelly:
    description: Give a Skelly Spawner (admin)
    usage: /skelly give <player> [amount]
  urj:
    description: ' '
    usage: /urj <code>
  giverank:
    description: Give a rank to a player (admin)
    usage: /giverank <player> <rank>
  homes:
    description: Open your homes dashboard
    usage: /homes
    aliases: [home]
  afk:
    description: Go AFK and earn Emerald while standing still
    usage: /afk
  emeraldshop:
    description: Spend Emerald (Skelly Spawners, Emerald Pickaxe)
    usage: /emeraldshop
    aliases: [eshop, emshop]
  scoreboard:
    description: Edit your own scoreboard
    usage: /scoreboard
    aliases: [sb, board]
  emerald:
    description: Show your Emerald, or manage it (admin)
    usage: /emerald [give|take <player> <amount>]
  announce:
    description: Announce a message to the whole server (admin)
    usage: /announce <text>

permissions:
  capybara.admin:
    description: Manage lives, economy and reload the plugin
    default: op
